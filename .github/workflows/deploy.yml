name: Deploy

# main'e her push: test → imaj (GHCR) → kube-objects dev + prod overlay → ArgoCD otomatik senkron.
# Aynı imaj dev'de sha-xxxxxxx, prod'da prod-xxxxxxx tag'iyle çalışır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prod: ${{ steps.meta.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "prod=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.prod }}
            ${{ env.IMAGE }}:dev-latest
            ${{ env.IMAGE }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  gitops:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: kube-objects dev + prod tag
        env:
          KUBE_OBJECTS_DEPLOY_KEY: ${{ secrets.KUBE_OBJECTS_DEPLOY_KEY }}
          KUBE_OBJECTS_TOKEN: ${{ secrets.KUBE_OBJECTS_TOKEN }}
        run: |
          ci/bump-kube-objects-image.sh be dev "${{ needs.image.outputs.tag }}"
          ci/bump-kube-objects-image.sh be prod "${{ needs.image.outputs.prod }}"
      - name: Özet
        run: |
          {
            echo "### BE yayında"
            echo "- dev → \`${{ needs.image.outputs.tag }}\` (dev-api-diecutting.ledayazilim.com)"
            echo "- prod → \`${{ needs.image.outputs.prod }}\` (api-diecutting.ledayazilim.com)"
          } >> "$GITHUB_STEP_SUMMARY"
